<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obfuscate — KRNL</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/krnl.png" type="image/png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="nav">
  <a class="brand" href="/"><img src="/assets/krnl.png" width="44" height="44" alt=""><span>KRNL</span></a>
  <nav>
    <a href="/">Home</a>
    <a href="/hot-scripts/">Scripts</a>
    <a href="/discord">Discord</a>
  </nav>
</header>

<main class="block" style="margin-top:36px">
  <h2>Obfuscate</h2>
  <p class="muted" style="margin-top:-8px">
    Protect a script before publishing it. Anyone running KRNL can execute the output; nobody needs the password.
  </p>

  <div class="obf">
    <div class="pane">
      <label for="src">Script</label>
      <textarea id="src" spellcheck="false" placeholder="print('hello')"></textarea>
    </div>

    <div class="pane">
      <label for="pass">Script password</label>
      <input id="pass" type="password" autocomplete="new-password" placeholder="keep this private">

      <label for="out" style="margin-top:14px">Output</label>
      <textarea id="out" spellcheck="false" readonly placeholder="krnl.SECURE_RUN(...)"></textarea>
    </div>
  </div>

  <div class="obf-actions">
    <button class="btn primary" id="go">Obfuscate</button>
    <button class="btn" id="copy" disabled>Copy</button>
    <label class="check"><input type="checkbox" id="scramble" checked> scramble strings</label>
    <span class="muted" id="stats"></span>
  </div>

  <p class="muted" style="margin-top:22px;font-size:13px">
    Paste the output into ScriptBlox or your loader. It runs as-is inside KRNL.
  </p>
</main>

<footer>
  <span>© <span id="year"></span> purrguy</span>
  <span>Keep the password; the output cannot be regenerated without it.</span>
</footer>

<script src="/encrypt.js" defer></script>
</body>
</html>
